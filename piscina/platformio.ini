; ================================================================
;  PISCINA — unidad flotante
;  Heltec WiFi LoRa 32 V3 (ESP32-S3 + SX1262)
; ================================================================

[env:heltec_wifi_lora_32_V3]
platform  = espressif32 @ 6.10.0
board     = heltec_wifi_lora_32_V3
framework = arduino

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed    = 921600

; Versiones EXACTAS, sin ^ ni ~ — es un proyecto de titulación y tiene que
; compilar igual dentro de un año que hoy. Para subir alguna: cambiar el
; número aquí, compilar, probar en placa, y commitear el cambio solo.
lib_deps =
  jgromes/RadioLib @ 6.6.0
  milesburton/DallasTemperature @ 3.11.0
  paulstoffregen/OneWire @ 2.3.8
  bblanchon/ArduinoJson @ 6.21.6
  madhephaestus/ESP32Servo @ 1.2.1

build_flags =
  ; 0, no 1. Esta placa NO usa el USB nativo del ESP32-S3: lleva un puente
  ; CP2102 (VID 0x10C4 / PID 0xEA60) colgado de UART0 (GPIO 43/44), que es
  ; por donde salen tanto el monitor como la carga.
  ;
  ; Con este flag a 1, Serial se mapea al USB nativo (GPIO 19/20), que en
  ; esta placa no va a ninguna parte: el firmware corre bien pero no imprime
  ; absolutamente nada y parece colgado.
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DCORE_DEBUG_LEVEL=1
  -I../shared

build_src_filter =
  +<*>
  +<../../shared/>
