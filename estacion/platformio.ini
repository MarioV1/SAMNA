; ================================================================
;  ESTACION — estación base (WiFi + Firebase + LoRa)
;  Heltec WiFi LoRa 32 V3 (ESP32-S3 + SX1262)
; ================================================================

[env:heltec_wifi_lora_32_V3]
platform  = espressif32 @ 6.10.0
board     = heltec_wifi_lora_32_V3
framework = arduino

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed    = 921600

; Versiones EXACTAS, sin ^ ni ~ — es un proyecto de titulación y tiene que
; compilar igual dentro de un año que hoy. Para subir alguna: cambiar el
; número aquí, compilar, probar en placa, y commitear el cambio solo.
;
; RadioLib DEBE coincidir con la de piscina/platformio.ini.
lib_deps =
  jgromes/RadioLib @ 6.6.0
  mobizt/Firebase ESP32 Client @ 4.4.17
  bblanchon/ArduinoJson @ 6.21.6

build_flags =
  ; 0, no 1. Ver la nota extendida en piscina/platformio.ini: esta placa usa
  ; un puente CP2102 sobre UART0, no el USB nativo del ESP32-S3. Con este
  ; flag a 1 el firmware corre pero no imprime nada.
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DCORE_DEBUG_LEVEL=1
  -I../shared

build_src_filter =
  +<*>
  +<../../shared/>
